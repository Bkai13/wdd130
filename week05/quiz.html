        <form>
            <fieldset>
                <legend>Question 1</legend>
                <label for="q1">What attribute goes inside this link element to connect it to a CSS
                    document properly. || link rel="__________" href="styles/quiz.css" ||</label>

                <textarea name="q2" id="q2" required></textarea>

            <fieldset>

                <label for="q3">What is the universal selector for CSS?</label>
                <select name="q3" id="q3">
                    <option value="1">^</option>
                    <option value="2">*</option>
                    <option value="3">$</option>
                    <option value="4">#</option>

                <label for="q4">The Quick way to setup a HTML documnet is to type html:_ . Fill in

                    blank number.</label>

        </form>
