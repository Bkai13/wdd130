<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us Page</title>
    <meta name="description" content="White Water Rafting Contact Page">
    <meta name="author" content="Kai Black">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting.png" alt="Company Logo containing people white water rafting">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="contact">
            <h1>White Water Rafting</h1>
            <article>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 (999) 999-9999</p>
                <p>info@whitewater.com</p>
            </article>
        </div>

        <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d4520891.591508471!2d-28.606835250663618!3d38.51464690973782!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1780961290574!5m2!1sen!2sus"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <form class="form">
            <fieldset class="column1">
                <div>
                    <label for="name">Name:</label>
                    <input type="text" name="name" id="name">
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="text" name="email" id="email">
                </div>
            </fieldset>

            <fieldset class="column2">
                <label for="purpose">Message Purpose:</label>
                <div>
                    <input type="radio" name="purpose" id="GI" value="General Inquiry">
                    <label for="GI">General Inquiry</label>
                </div>
                <div>
                    <input type="radio" name="purpose" id="RQ" value="Reservation Question">
                    <label for="RQ">Reservation Question</label>
                </div>
                <div>
                    <input type="radio" name="purpose" id="WS" value="Website Suggestion">
                    <label for="WS">Website Suggestion</label>
                </div>
            </fieldset>

            <fieldset class="column3">
                <label for="message">Message:</label>
                <textarea name="message" id="message" rows="4" placeholder="Type Here"></textarea>
            </fieldset>

            <fieldset class="column4">
                <div>
                    <input type="checkbox" name="news" id="news">
                    <label for="news">Please Subscribe me to the monthly newsletter</label>
                </div>
            </fieldset>

            <button type="submit">Submit Message</button>

        </form>

        <div class="serve">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/owner.jpg" alt="Davey Harry">
                <figcaption>Owner</figcaption>
            </figure>
            <figure>
                <img src="images/coordinator.jpg" alt="Lisa richards">
                <figcaption>Cordinator</figcaption>
            </figure>
            <figure>
                <img src="images/guide.jpg" alt="Guy Chapel">
                <figcaption>Guide</figcaption>
            </figure>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 All-Outdoors California Whitewater Rafting</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com"><img src="images/instagram.svg"
                  alt="instagram logo"></a>
            <a href="https://www.facebook.com"><img src="images/facebook.svg"
                  alt="facebook logo"></a>
            <a href="https://www.youtube.com"><img src="images/youtube.svg" alt="Youtube logo"></a>
        </nav>
    </footer>
</body>

</html>
