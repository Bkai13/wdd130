<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | About Us Page</title>
    <meta name="description" content="White Water Rafting Home Page">
    <meta name="author" content="Kai Black">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting.png" alt="Company Logo containing people white water rafting">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/rafting-hero.jpg" alt="Several people rafting down rapids">
            <h1>All-Outdoors California Whitewater Rafting</h1>
        </div>

        <div class="group">

            <form class="form">
                <fieldset class="column1">
                    <legend for="purpose">Sign Up For Our Newsletter!</legend>
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="name">
                    </div>
                    <div>
                        <label for="email">Email:</label>
                        <input type="text" name="email" id="email">
                    </div>
                </fieldset>
            </form>

            <div class="call">
                <a href="trips.html">Want to go White Water Rafting? Then visit our trips page!</a>
            </div>

        </div>

        <div class="additional">
            <h2>Our Guarantees</h2>
            <figure>
                <img src="images/happy-customer.jpg" alt="Finished trip">
                <figcaption>Customer Satisfaction</figcaption>
            </figure>
            <figure>
                <img src="images/ouch.jpg" alt="Equipment Provided">
                <figcaption>Equipment and Guide</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 All-Outdoors California Whitewater Rafting</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com"><img src="images/instagram.svg"
                  alt="instagram logo"></a>
            <a href="https://www.facebook.com"><img src="images/facebook.svg"
                  alt="facebook logo"></a>
            <a href="https://www.youtube.com"><img src="images/youtube.svg" alt="Youtube logo"></a>
        </nav>
    </footer>
</body>

</html>
